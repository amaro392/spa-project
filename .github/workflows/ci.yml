#comando para dar el nombre del flujo
name: CI pipeline

#Indica cuando se ejecuta el flujo:
on:
  pull_request:
  push:
    branches:
      - develop

#acciones que se ejecturan en el servidor:
jobs:
  fronted-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fronted

    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4

      - name: Setup node (instalar node)
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Construir fronted
        run: npm run build